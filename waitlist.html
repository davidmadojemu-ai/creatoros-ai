<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Join Waitlist — CreatorOS AI</title>
  <style>
    :root {
      --bg: #090909; --line: rgba(255,255,255,.1); --line-soft: rgba(255,255,255,.065);
      --text: #f7f5ff; --muted: #a7a3b3; --green: #55e5a4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; text-decoration: none; }
    .wrap {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 0%, rgba(255,107,74,.14), transparent 40%), var(--bg);
    }
    .card {
      width: min(440px, 100%); padding: 36px 28px 32px;
      border: 1px solid rgba(255,140,110,.28); border-radius: 28px;
      background: linear-gradient(160deg, rgba(255,107,74,.08), rgba(255,255,255,.03) 40%, rgba(12,12,16,.9));
      box-shadow: 0 40px 100px rgba(0,0,0,.45); text-align: center;
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 18px; object-fit: contain; }
    .kicker { display: inline-flex; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    .sub { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    form { margin-top: 26px; text-align: left; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 12px; font-weight: 600; color: var(--muted); }
    input {
      width: 100%; margin-top: 6px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px;
      background: rgba(10,10,14,.75); color: white; font-size: 15px; outline: none;
    }
    input:focus { border-color: rgba(255,107,74,.55); box-shadow: 0 0 0 3px rgba(255,107,74,.12); }
    .btn {
      margin-top: 8px; width: 100%; min-height: 50px; border: 0; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #ff7a5c 0%, #e85a3a 45%, #ff8f6a 100%);
      color: white; font-size: 15px; font-weight: 700; box-shadow: 0 12px 32px rgba(230,90,60,.32);
    }
    .btn:disabled { opacity: .65; cursor: not-allowed; }
    .error {
      display: none; margin-top: 4px; padding: 12px 14px; border: 1px solid rgba(255,90,90,.4);
      border-radius: 12px; background: rgba(255,70,70,.1); color: #ffb4b4; font-size: 13px; font-weight: 600;
    }
    .error.show { display: block; }
    .success-view { display: none; }
    .success-view.show { display: block; }
    .form-view.hide { display: none; }
    .check {
      width: 72px; height: 72px; margin: 8px auto 18px; border-radius: 50%;
      background: rgba(85,229,164,.12); border: 1px solid rgba(85,229,164,.35);
      display: grid; place-items: center; color: var(--green); font-size: 34px;
    }
    .success-msg { margin: 0; font-size: 16px; line-height: 1.55; color: #d8d4e0; }
    .success-msg strong { color: white; }
    .home-btn {
      display: inline-flex; margin-top: 24px; min-height: 48px; padding: 0 22px; border-radius: 14px;
      border: 1px solid var(--line); background: rgba(255,255,255,.05); color: white; font-weight: 700; font-size: 14px;
    }
    .stay { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line-soft); }
    .stay h3 { margin: 0 0 6px; font-size: 15px; }
    .stay p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .socials { display: flex; justify-content: center; gap: 12px; }
    .socials a {
      width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px;
      border: 1px solid var(--line-soft); background: rgba(255,255,255,.04); color: #c5c0cd;
    }
    .socials svg { width: 20px; height: 20px; }
    .back-top { margin-top: 28px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .debug { margin-top: 12px; font-size: 11px; color: #6a6572; word-break: break-all; text-align: left; display: none; }
    .debug.show { display: block; }
  </style>
</head>

  <script>
  const SUPABASE_URL = "https://kcjbblafkwhnhgpoyadc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_CutDUdxWEr6ikT4zS6nScA_wSq6dU8B";
  const STORAGE_KEY = "creatoros_waitlist_emails";

  const form = document.getElementById("reg-form");
  const errorEl = document.getElementById("error");
  const debugEl = document.getElementById("debug");
  const formView = document.getElementById("form-view");
  const successView = document.getElementById("success-view");
  const submitBtn = document.getElementById("submit-btn");

  function showError(msg, debug) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
    if (debug) {
      debugEl.textContent = debug;
      debugEl.classList.add("show");
    }
  }

  function getLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveLocal(email, name, ts) {
    const list = getLocal();
    list.push({ email: email.toLowerCase(), name: name, ts: ts });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }
  function isLocalDup(email) {
    const e = email.toLowerCase().trim();
    return getLocal().some(function (x) { return (x.email || x) === e; });
  }

  async function insertRow(name, email) {
    const res = await fetch(SUPABASE_URL + "/rest/v1/waitlist", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify([{ full_name: name, email: email.toLowerCase() }])
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }

    if (res.status === 409 || (typeof text === "string" && /duplicate|unique/i.test(text))) {
      return { ok: false, duplicate: true, raw: text };
    }
    if (!res.ok) {
      return { ok: false, duplicate: false, status: res.status, raw: text };
    }
    return { ok: true, data: data };
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorEl.classList.remove("show");
    debugEl.classList.remove("show");
    errorEl.textContent = "";
    debugEl.textContent = "";

    const name = (form.name.value || "").trim();
    const email = (form.email.value || "").trim();

    if (!name) { showError("Please enter your full name."); return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError("Please enter a valid email address."); return;
    }
    if (isLocalDup(email)) {
      showError("This email is already registered. Please use another email."); return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Joining…";
    const ts = new Date().toISOString();

    try {
      const result = await insertRow(name, email);

      if (result.duplicate) {
        showError("This email is already registered. Please use another email.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Join Waitlist";
        return;
      }

      if (!result.ok) {
        showError(
          "Could not save to database. Please try again.",
          "HTTP " + (result.status || "?") + " — " + String(result.raw).slice(0, 200)
        );
        submitBtn.disabled = false;
        submitBtn.textContent = "Join Waitlist";
        return;
      }

      saveLocal(email, name, ts);

      // Email founder with signup details
      await notifyFounder(name, email, ts);

      formView.classList.add("hide");
      successView.classList.add("show");
    } catch (err) {
      showError(
        "Network error. If you opened this as a local file, host it online (or use Live Server) so Supabase can be reached.",
        String(err && err.message ? err.message : err)
      );
      submitBtn.disabled = false;
      submitBtn.textContent = "Join Waitlist";
    }
  });

  // Send signup details to company email (FormSubmit)
  // First successful hosted submit sends an activation email to the inbox — click it once.
  function notifyFounder(name, email, ts) {
    return new Promise(function (resolve) {
      try {
        var iframe = document.getElementById("founder-mail-frame");
        if (!iframe) {
          iframe = document.createElement("iframe");
          iframe.name = "founder-mail-frame";
          iframe.id = "founder-mail-frame";
          iframe.style.cssText = "display:none;width:0;height:0;border:0;";
          document.body.appendChild(iframe);
        }
        var f = document.createElement("form");
        f.method = "POST";
        f.action = "https://formsubmit.co/creatorosaisupport@gmail.com";
        f.target = "founder-mail-frame";
        f.style.display = "none";

        function field(n, v) {
          var i = document.createElement("input");
          i.type = "hidden";
          i.name = n;
          i.value = v;
          f.appendChild(i);
        }
        field("name", name);
        field("email", email);
        field("_replyto", email);
        field("_subject", "CreatorOS AI — New Waitlist Registration");
        field("message",
          "New waitlist signup for CreatorOS AI\n\n" +
          "Full Name: " + name + "\n" +
          "Email: " + email + "\n" +
          "Timestamp: " + ts + "\n\n" +
          "Saved in Supabase waitlist table."
        );
        field("_template", "table");
        field("_captcha", "false");
        field("_honey", "");

        document.body.appendChild(f);
        f.submit();
        setTimeout(function () {
          try { document.body.removeChild(f); } catch (e) {}
          resolve(true);
        }, 1500);
      } catch (err) {
        console.warn("Founder email notify failed", err);
        resolve(false);
      }
    });
  }
  </script>
</body>
